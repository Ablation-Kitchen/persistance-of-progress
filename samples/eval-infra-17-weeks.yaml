  # ------------------------------------------------------------------ Weeks 16–17
  - title: "Weeks 16–17: Interview prep"
    goal: "Turn 8 years of backend work plus the capstone into crisp answers for practical coding, system design, and past-project deep dives."
    description: |
      **Practical coding** (5 one-hour timed sessions): these tend to look like real infrastructure
      work, not puzzles. Practice from a blank file.

      **System design** (practice each out loud, 45 minutes): for each, cover the requirements and
      scale numbers, data model, scheduling, failure handling and resume, observability, and cost.
      Reference: *System Design Interview* (Alex Xu), vol. 1 and 2, for format practice; your
      capstone for content.
    tasks:
      # Week 16
      - id: design-checkpoint-eval-platform
        day: 106
        kind: exercise
        title: "System design: a platform that runs thousands of evals on every new training checkpoint"
        description: "On a GPU fleet shared with training, flagging regressions within hours. 45 minutes, out loud."
        links:
          - title: "System Design Interview, vol. 1–2 (Alex Xu)"
      - id: story-bank
        day: 106
        dueDay: 117
        kind: exercise
        title: "Fill in the story bank"
        description: "One story (situation, action, result) with numbers for each posting bullet."
        noteTemplate: |
          | Posting bullet | My story (situation, action, result) | Numbers |
          | --- | --- | --- |
          | Highly reliable, easy-to-use infrastructure |  |  |
          | Collaborating with other teams on internal tooling |  |  |
          | Resolving a performance bottleneck |  |  |
          | Large-scale distributed systems |  |  |
          | Diving deep into a hard bug at any level of the stack |  |  |
          | Capstone: eval platform and benchmark report |  |  |
      - id: coding-async-worker-pool
        day: 107
        kind: exercise
        title: "Timed coding: async worker pool"
        description: "A concurrency limit, per-task timeout, and retries with backoff. One hour, from a blank file."
      - id: design-eval-inference-layer
        day: 108
        kind: exercise
        title: "System design: the inference layer for evals"
        description: "Hundreds of model checkpoints, bursty demand, a fixed GPU budget. 45 minutes, out loud."
      - id: coding-token-bucket
        day: 109
        kind: exercise
        title: "Timed coding: token-bucket rate limiter"
        description: "Then make it safe across threads or coroutines. One hour, from a blank file."
      - id: coding-priority-scheduler
        day: 110
        kind: exercise
        title: "Timed coding: priority job scheduler with preemption"
        description: "Jobs have priority and GPU count; the cluster has N GPUs. One hour, from a blank file."
      - id: leetcode-week-16
        day: 110
        kind: exercise
        optional: true
        title: "LeetCode: 1–2 mediums (heaps, graphs, intervals)"
        description: "Swap one build session this week for this, in case the loop includes a classic round."
      - id: learnings-week-16
        day: 111
        kind: reflection
        title: "Week 16 review"
        description: "Write 3 sentences on what you learned this week, and choose next week's tasks."
      # Week 17
      - id: design-model-comparison-service
        day: 113
        kind: exercise
        title: "System design: a model comparison service"
        description: "Store every completion and score, and support slicing by benchmark, category and checkpoint. 45 minutes, out loud."
      - id: mock-system-design-interviews
        day: 113
        dueDay: 118
        kind: exercise
        title: "Two mock system design interviews"
        description: "With a peer or a paid mock service."
      - id: coding-lru-prefix-cache
        day: 114
        kind: exercise
        title: "Timed coding: LRU cache with TTL, plus a prefix cache on token sequences"
        description: "The prefix cache is a simplified version of RadixAttention. One hour, from a blank file."
      - id: design-agentic-eval-runner
        day: 115
        kind: exercise
        title: "System design: the eval runner for agentic tasks"
        description: "Tasks run for an hour each in sandboxes (e.g. SWE-bench style). 45 minutes, out loud."
      - id: coding-streaming-accuracy
        day: 116
        kind: exercise
        title: "Timed coding: streaming per-model accuracy with confidence intervals"
        description: "Parse a large log of eval results, in bounded memory. One hour, from a blank file."
      - id: leetcode-week-17
        day: 117
        kind: exercise
        optional: true
        title: "LeetCode: 1–2 mediums (heaps, graphs, intervals)"
        description: "Swap one build session this week for this, in case the loop includes a classic round."
      - id: why-evals-answer
