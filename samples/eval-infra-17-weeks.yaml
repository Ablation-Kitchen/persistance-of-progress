  # ------------------------------------------------------------------ Weeks 14–15
  - title: "Weeks 14–15: GPU fleet scheduling"
    goal: "Speak fluently about sharing scarce GPUs between training, evals and research."
    description: "The \"capacity fleet management\" and \"dynamic resource optimization\" part of the posting."
    tasks:
