// ---------- dates: plain YYYY-MM-DD, UTC math ----------
const toMs = s => Date.parse(s + "T00:00:00Z");
const addDays = (s, n) => new Date(toMs(s) + n * 864e5).toISOString().slice(0, 10);
const diffDays = (a, b) => Math.round((toMs(a) - toMs(b)) / 864e5);
const fmt = s => new Date(toMs(s)).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
const wd = s => new Date(toMs(s)).toLocaleDateString("en-GB", { weekday: "short", timeZone: "UTC" });
const dnum = s => new Date(toMs(s)).getUTCDate();

const TASKS = [];
PATH.blocks.forEach((b, bi) => b.tasks.forEach(t => TASKS.push({ ...t, block: bi, order: TASKS.length })));
const BY_ID = Object.fromEntries(TASKS.map(t => [t.id, t]));

// ---------- in-memory Enrollment ----------
const START = "2026-11-16";
let S;
const fresh = today => ({ today, ts: {}, notes: {}, noteEdits: {}, shifts: [], sel: null, open: new Set(), view: null });
const st = id => S.ts[id] || { status: "todo", offset: 0 };
const status = t => st(t.id).status;
const effDay = t => t.day + (st(t.id).offset || 0);
const effDue = t => (t.dueDay ?? t.day) + (st(t.id).offset || 0);
const dateOf = d => addDays(START, d - 1);
const dayNo = () => diffDays(S.today, START) + 1;
const lastDay = () => Math.max(...TASKS.map(effDue));
const blockOfDay = d => { let bi = 0; PATH.blocks.forEach((b, i) => { if (Math.min(...b.tasks.map(t => t.day)) <= d) bi = i; }); return bi; };
const rhythm = d => (PATH.weekRhythm || [])[((d - 1) % 7 + 7) % 7] || "";
const weekOf = d => Math.floor((d - 1) / 7) + 1;
const sortT = a => a.sort((x, y) => effDay(x) - effDay(y) || x.order - y.order);

function buckets() {
  const D = dayNo();
  return {
    D,
    overdue: sortT(TASKS.filter(t => !t.optional && status(t) === "todo" && effDue(t) < D)),
    today: sortT(TASKS.filter(t => effDay(t) === D)),
    ongoing: sortT(TASKS.filter(t => status(t) === "todo" && effDay(t) < D && effDue(t) >= D)),
    doneToday: TASKS.filter(t => st(t.id).statusDate === S.today && status(t) === "done" && effDay(t) !== D && !(effDay(t) < D && effDue(t) >= D)),
  };
}
function stats() {
  const req = TASKS.filter(t => !t.optional);
  const done = req.filter(t => status(t) === "done").length;
  const bonus = TASKS.filter(t => t.optional && status(t) === "done").length;
  // Streak (007, amended by 008): a day counts if a Task was done OR a Note was edited that day.
  // Days with nothing scheduled are skipped over; today only breaks the streak once it has ended.
  const active = new Set([...TASKS.filter(t => status(t) === "done").map(t => st(t.id).statusDate), ...Object.values(S.noteEdits).flat()]);
  const sched = new Set(TASKS.map(t => dateOf(effDay(t))));
  let streak = active.has(S.today) ? 1 : 0, d = addDays(S.today, -1);
  while (diffDays(d, START) >= 0) { if (active.has(d)) streak++; else if (sched.has(d)) break; d = addDays(d, -1); }
  const perBlock = PATH.blocks.map((b, bi) => { const r = TASKS.filter(t => t.block === bi && !t.optional); return { n: r.length, done: r.filter(t => status(t) === "done").length }; });
  return { pct: Math.round(100 * done / req.length), done, req: req.length, bonus, streak, perBlock };
}

// ---------- actions ----------
function setStatus(id, s) {
  const cur = st(id);
  S.ts[id] = s === "todo" ? { status: "todo", offset: cur.offset || 0 } : { ...cur, status: s, statusDate: S.today };
}
function shift(n) {
  n = Math.max(1, Math.floor(n || 0));
  const ids = TASKS.filter(t => status(t) === "todo").map(t => t.id);
  ids.forEach(id => { const c = st(id); S.ts[id] = { ...c, offset: (c.offset || 0) + n }; });
  S.shifts.push({ appliedOn: S.today, days: n, taskIds: ids });
}
function undoShift() { const s = S.shifts.pop(); if (s) s.taskIds.forEach(id => { const c = st(id); S.ts[id] = { ...c, offset: c.offset - s.days }; }); }
function noteVal(key) {
  if (!(key in S.notes) && key.startsWith("task:") && BY_ID[key.slice(5)]?.noteTemplate) S.notes[key] = BY_ID[key.slice(5)].noteTemplate;
  return S.notes[key] ?? "";
}

// ---------- scenarios ----------
const hash = s => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 100; };
function seedHistory(D) {
  TASKS.forEach(t => {
    if (t.day >= D) return;
    const h = hash(t.id), due = t.dueDay ?? t.day;
    if (t.optional) { if (h < 45) S.ts[t.id] = { status: "done", statusDate: dateOf(due), offset: 0 }; return; }
    if (due >= D) { if (h < 25) S.ts[t.id] = { status: "done", statusDate: dateOf(D - 1), offset: 0 }; return; }
    if (h < 93) S.ts[t.id] = { status: "done", statusDate: dateOf(Math.min(D - 1, due)), offset: 0 };
    else if (h < 96) S.ts[t.id] = { status: "skipped", statusDate: dateOf(t.day), offset: 0 };
  });
  // build days spent on an exercise in progress: the learner adds a line to its Note
  TASKS.filter(t => t.kind === "exercise" && t.dueDay && t.day < D).forEach(t => {
    const end = Math.min(D - 1, t.dueDay), dates = [];
    for (let d = t.day; d <= end; d++) if (/Build/.test(rhythm(d))) dates.push(dateOf(d));
    if (dates.length) { S.noteEdits["task:" + t.id] = dates; S.notes["task:" + t.id] = dates.map(x => `- ${fmt(x)}: worked on it`).join("\n"); }
  });
}
const SCENARIOS = {
  before: { label: "before start", make: () => (S = fresh(addDays(START, -3))) },
  day2: { label: "week 1 · tue", make: () => { S = fresh(dateOf(2)); seedHistory(2); return S; } },
  day24: { label: "week 4 · wed", make: () => { S = fresh(dateOf(24)); seedHistory(24); return S; } },
  day78: { label: "week 12 · mon", make: () => { S = fresh(dateOf(78)); seedHistory(78); return S; } },
  day104: { label: "week 15 · sat (8 tasks)", make: () => { S = fresh(dateOf(104)); seedHistory(104); return S; } },
  after: { label: "after the end", make: () => { S = fresh(dateOf(124)); seedHistory(119); return S; } },
};

// ---------- rendering helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  if (!s) return "";
  return esc(s).split(/\n\s*\n/).map(p => "<p>" + p.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\n)\s*- /g, "$1· ").replace(/\n/g, "<br>") + "</p>").join("");
}
const links = t => (t.links || []).map(l => l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)} ↗</a>` : `<span class="mono">book · ${esc(l.title)}</span>`).join("<br>");
const kindLabel = t => `<span class="kind mono">${t.kind}${t.optional ? " · optional" : ""}</span>`;
function when(t, D) {
  const d = effDay(t), due = effDue(t);
  if (status(t) === "done") return `<span class="mono status-ok">done ${st(t.id).statusDate === S.today ? "today" : fmt(st(t.id).statusDate).toLowerCase()}</span>`;
  if (status(t) === "skipped") return `<span class="mono">skipped</span>`;
  if (due < D) return `<span class="mono status-over">${D - due}d overdue</span>`;
  if (due > d && D >= d) return `<span class="mono">day ${D - d + 1} of ${due - d + 1} · due ${wd(dateOf(due)).toLowerCase()}</span>`;
  if (due > d) return `<span class="mono">${due - d + 1} sessions · due ${wd(dateOf(due)).toLowerCase()}</span>`;
  return "";
}
const checkIcon = `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>`;

function card(t, D) {
  const s = status(t), open = S.open.has(t.id);
  return `<article class="card ${S.sel === t.id ? "sel" : ""}">
    <div class="card-top">${kindLabel(t)}${s === "todo" && effDue(t) < D && !t.optional ? '<span class="dot" aria-hidden="true"></span>' : ""}</div>
    <div class="card-main">
      <button class="check ${s === "done" ? "on" : ""}" data-act="toggle" data-id="${t.id}" aria-label="${s === "done" ? "Mark not done" : "Mark done"}: ${esc(t.title)}" aria-pressed="${s === "done"}">${s === "done" ? checkIcon : ""}</button>
      <button class="title-btn ${s !== "todo" ? "struck" : ""}" data-act="select" data-id="${t.id}" aria-pressed="${S.sel === t.id}">${esc(t.title)}</button>
    </div>
    <div class="card-foot">${when(t, D)}
      ${(t.description || t.links) ? `<button class="linkbtn" data-act="expand" data-id="${t.id}" aria-expanded="${open}">${open ? "less −" : "more +"}</button>` : ""}
      ${s === "todo" ? `<button class="linkbtn" data-act="skip" data-id="${t.id}">skip</button>` : s === "skipped" ? `<button class="linkbtn" data-act="todo" data-id="${t.id}">unskip</button>` : ""}
    </div>
    ${open ? `<div class="desc">${md(t.description)}${links(t) ? `<p>${links(t)}</p>` : ""}</div>` : ""}
  </article>`;
}
function col(title, sub, list, D, extra = "") {
  return `<section class="col"><h2 class="serif"><span>${title}</span><span class="mono">${list.length}</span></h2>
    ${sub ? `<p class="sub mono">${sub}</p>` : ""}${extra}
    ${list.map(t => card(t, D)).join("") || `<p class="empty mono">nothing here</p>`}</section>`;
}
function shiftCtl() {
  const last = S.shifts[S.shifts.length - 1];
  return `<div class="shift"><label class="mono" for="shiftN" style="margin:0">shift open tasks by</label>
    <input id="shiftN" type="number" min="1" value="1"><span class="mono">days</span>
    <button class="pill sm" data-act="shift">Shift</button>
    ${last ? `<button class="pill sm ghost" data-act="undo">undo +${last.days}d</button>` : ""}</div>`;
}

// ---------- the page ----------
function Page() {
  const { D, overdue, today, ongoing, doneToday } = buckets(); const s = stats();
  const end = lastDay(), before = D < 1, after = D > end;
  const b = PATH.blocks[blockOfDay(Math.max(1, Math.min(D, end)))];
  const wk = Math.max(1, weekOf(Math.max(1, Math.min(D, end))));
  const V = S.view ?? D, vDate = dateOf(V), noteDate = S.view == null ? S.today : vDate;
  const sel = S.sel && BY_ID[S.sel];

  const eyebrow = before ? `starts ${fmt(START).toLowerCase()} · in ${1 - D} day${1 - D > 1 ? "s" : ""}`
    : after ? `path finished · ${fmt(S.today).toLowerCase()}`
    : `day ${D} · week ${wk} of ${weekOf(end)} · ${fmt(S.today).toLowerCase()}${rhythm(D) ? " · " + rhythm(D).toLowerCase() + " day" : ""}`;
  const heading = before ? `Almost <em>ready</em>.` : after ? `You <em>finished</em> it.` : `Today<em>.</em>`;

  const hero = `<section class="hero rise">
    <div><p class="eyebrow mono"><span class="dot pulse" aria-hidden="true"></span>${eyebrow}</p>

      <p class="goal">${before ? esc(PATH.title) + ". Day 1 is below; you can tick things off early." : `<span class="mono" style="display:block;margin-bottom:4px">${esc(b.title)}</span>${esc(b.goal)}`}</p></div>
    <dl class="stats">

    return `<button class="day ${d === D ? "today" : ""} ${d === S.view ? "viewing" : ""}" data-act="viewday" data-day="${d}" aria-pressed="${d === V}" aria-label="${fmt(date)}, ${ts.length} tasks">
      <span class="mono">${wd(date).toLowerCase()}</span> <span class="d">${dnum(date)}</span>
      <span class="lbl mono">${rhythm(d).toLowerCase() || "off"}</span><span class="dots">${dots}</span></button>`;

  else if (after) main = `<div class="edge"><h2 class="serif">${s.done} of ${s.req}</h2><p class="mono">required tasks · +${s.bonus} bonus · enrollment stays active until you switch</p></div>
    <div class="cols" style="grid-template-columns:1fr">${col("Still open", "overdue after the last day", overdue, D, overdue.length ? shiftCtl() : "")}</div>`;
  else {
    const viewList = S.view == null ? today : sortT(TASKS.filter(t => effDay(t) === V));
    const middle = S.view == null ? col("Today", rhythm(D).toLowerCase() || "off day", today, D)
      : col(fmt(vDate), `${rhythm(V).toLowerCase() || "off day"} · ${V < D ? "past" : "ahead"}`, viewList, D, `<button class="pill sm ghost" data-act="viewday" data-day="${D}" style="margin:-4px 0 4px -12px">← back to today</button>`);
    main = week + `<div class="cols">
      ${col("Catch up", "overdue, oldest first", overdue, D, overdue.length || S.shifts.length ? shiftCtl() : "")}
      ${middle}
      ${col("In progress", "open exercises", ongoing, D)}</div>
      ${doneToday.length ? `<p class="mono" style="margin-top:14px">also done today · ${doneToday.map(t => esc(t.title)).join(" · ")}</p>` : ""}`;
  }

  const side = `<aside aria-label="Details and notes">
    ${sel ? `${kindLabel(sel)}<h3 class="serif" style="margin-top:6px">${esc(sel.title)}</h3><div>${when(sel, D)}</div>
      <div style="font-size:14px;color:var(--soft)">${md(sel.description)}</div>${links(sel) ? `<p style="font-size:14px">${links(sel)}</p>` : ""}
      <div class="actions">${status(sel) === "done" ? `<button class="pill sm" data-act="todo" data-id="${sel.id}">Mark not done</button>` : `<button class="pill sm solid" data-act="done" data-id="${sel.id}">${sel.kind === "checkpoint" ? "Yes, I can" : "Done"}</button>`}

  </aside>`;

  return `<header><div class="wrap"><nav aria-label="Main">
      <span class="brand"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V9M10 20V4M16 20v-8M22 20H2"/><path d="M16 12V7" stroke="var(--accent)"/></svg>learning<b>.</b>path</span>
      <div class="navlinks"><a class="navlink on" href="#" aria-current="page">Today</a><a class="navlink" href="#">Path</a><a class="navlink" href="#">Notes</a>
        <button class="pill sm" data-act="theme" aria-label="Switch between light and dark mode"><span class="dot" aria-hidden="true" style="background:var(--ink)"></span>${document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches) ? "light" : "dark"}</button></div>
    </nav></div></header>
    <main class="wrap">${hero}<div class="board"><div>${main}</div>${side}</div></main>`;
}

// ---------- wiring ----------
const params = new URLSearchParams(location.search);
let scen = SCENARIOS[params.get("scenario")] ? params.get("scenario") : "day24";
SCENARIOS[scen].make();
const sel = document.getElementById("scenario");
sel.innerHTML = Object.entries(SCENARIOS).map(([k, v]) => `<option value="${k}" ${k === scen ? "selected" : ""}>${v.label}</option>`).join("");

function render() {
  const focus = document.activeElement?.id;
  document.getElementById("app").innerHTML = Page();
  if (focus && document.getElementById(focus)) document.getElementById(focus).focus();
  const q = new URLSearchParams(location.search); q.set("scenario", scen); history.replaceState(null, "", "?" + q);
  const { D, overdue, today, ongoing } = buckets(); const s = stats();
  document.getElementById("state").textContent = JSON.stringify({
    today: S.today, dayNumber: D, rhythmLabel: rhythm(D) || null, viewing: S.view, lastEffectiveDay: lastDay(),
    derived: { percent: s.pct, requiredDone: `${s.done}/${s.req}`, bonus: s.bonus, streak: s.streak, overdue: overdue.length, todayTasks: today.length, inProgress: ongoing.length },
    shifts: S.shifts.map(x => ({ appliedOn: x.appliedOn, days: x.days, tasksMoved: x.taskIds.length })),
    taskStateRecords: Object.keys(S.ts).length,
    noteEditDates: S.noteEdits,
  }, null, 2);
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"), b = e.target.closest("[data-bar]");
  if (a) {
    const id = a.dataset.id;
    switch (a.dataset.act) {
      case "toggle": setStatus(id, status(BY_ID[id]) === "done" ? "todo" : "done"); break;
      case "done": setStatus(id, "done"); break;
      case "todo": setStatus(id, "todo"); break;
      case "skip": setStatus(id, "skipped"); break;
      case "expand": S.open.has(id) ? S.open.delete(id) : S.open.add(id); break;
      case "select": S.sel = S.sel === id ? null : id; break;
      case "viewday": { const d = +a.dataset.day; S.view = (d === dayNo() || d === S.view) ? null : d; break; }
      case "shift": shift(+document.getElementById("shiftN").value); break;
      case "undo": undoShift(); break;
      case "theme": { const r = document.documentElement, dark = r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches); r.dataset.theme = dark ? "light" : "dark"; break; }
    }
    render();
  }
  if (b) {
    const k = b.dataset.bar;
    if (k === "dayback" || k === "dayfwd") { S.today = addDays(S.today, k === "dayfwd" ? 1 : -1); S.view = null; }
    if (k === "state") { const p = document.getElementById("state"); p.style.display = p.style.display === "block" ? "none" : "block"; }
    render();
  }
});
document.addEventListener("input", e => {
  const k = e.target.dataset?.note; if (!k) return;
  S.notes[k] = e.target.value;
  const ed = S.noteEdits[k] || (S.noteEdits[k] = []); if (!ed.includes(S.today)) ed.push(S.today); // a Note edit counts for the streak
});
sel.addEventListener("change", () => { scen = sel.value; SCENARIOS[scen].make(); render(); });
render();
</script>
