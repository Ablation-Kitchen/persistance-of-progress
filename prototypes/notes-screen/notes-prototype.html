<!doctype html>
<!--
  PROTOTYPE, throwaway. Ticket 011: what should the Notes screen look like?
  Three structurally different variants, switchable via ?variant=A|B|C (or ←/→ and the bottom bar),
  on the real 17-week data embedded by build.sh. Notes are seeded deterministically; state is in memory only.
    A Journal  — one feed by week (the shape of the planned Markdown export); Task Notes sit on their Task's
                 effective day; inline editing with a Write/Preview toggle; week rail on the left.
    B Notebook — list + editor like a notes app; list by recent edit or path order; split live preview;
                 context header (Task status, what was done that day) and the edit-date trail.
    C By Block — the path's shape: per Block, Task Notes in path order with unwritten reflections shown as gaps,
                 Day Notes in a side timeline; editing in a drawer that shows the Task's prompt.
  Rules: one Note per target (Task id, calendar date, Enrollment) — 007; edits keep a trail of dates and count
  for the streak — 007 as amended by 008; noteTemplate fills a Note only when first created; tombstoned
  Tasks keep their Notes under "Removed Tasks" — 006. Visual direction: 008.
-->

const addDays = (s, n) => new Date(toMs(s) + n * 864e5).toISOString().slice(0, 10);

// ---------- tiny Markdown (paragraphs, lists, headings, tables, bold/italic/code/links) + search highlight ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
function md(src) {
  if (!src) return "";
  const L = src.replace(/\s+$/, "").split("\n"), out = []; let i = 0;
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (/^\s*\|/.test(l)) {
      const rows = []; while (i < L.length && /^\s*\|/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(rows[0]), body = rows.slice(/^[\s|:-]+$/.test(rows[1] || "") ? 2 : 1).map(cells);
      out.push(`<div class="tblwrap"><table><thead><tr>${head.map(h => `<th>${inl(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${head.map((_, k) => `<td>${inl(r[k] || "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    const h = l.match(/^(#{1,3})\s+(.*)/);
    if (h) { out.push(`<h${h[1].length + 1}>${inl(h[2])}</h${h[1].length + 1}>`); i++; continue; }
    if (/^\s*[-*]\s+/.test(l)) { const it = []; while (i < L.length && /^\s*[-*]\s+/.test(L[i])) it.push(L[i++].replace(/^\s*[-*]\s+/, "")); out.push(`<ul>${it.map(x => `<li>${inl(x)}</li>`).join("")}</ul>`); continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^\s*([-*]\s|\||#)/.test(L[i])) p.push(L[i++]);
    out.push(`<p>${p.map(inl).join("<br>")}</p>`);
  }
  return hl(out.join(""));
}
function hl(html) {
  const q = S.q.trim(); if (!q) return html;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  return html.replace(/(^|>)([^<]+)/g, (m, a, b) => a + b.replace(re, x => `<mark>${x}</mark>`));
}
const plain = s => s.replace(/[#*`|>-]+/g, " ").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/\s+/g, " ").trim();
function snippet(n) {
  const p = plain(n.text), q = S.q.trim().toLowerCase(), at = q ? p.toLowerCase().indexOf(q) : -1;
  const s = at > 40 ? "…" + p.slice(at - 30, at + 110) : p.slice(0, 140);

}

const pick = (arr, s) => arr[hash(s) % arr.length];

    ${enr ? `<section class="panel" style="border-color:var(--ink)"><div class="chips" style="justify-content:space-between"><span class="mono">enrollment note · about this run</span><button class="pill sm" data-act="drawer" data-k="enrollment">Edit</button></div><div class="md" style="margin-top:8px;columns:2 320px;column-gap:32px">${md(enr.text)}</div></section>` : ""}
    <div class="toolbar" style="margin-top:20px">${searchBar()}</div>
    <div class="c-blocks" role="group" aria-label="Blocks">${blockChips}</div>
    <div class="c-layout">${main}${side}</div>${drawer}<div style="height:30px"></div>`;
}

// ---------- shell + wiring ----------
const VARIANTS = { A: ["Journal", VariantA], B: ["Notebook", VariantB], C: ["By Block", VariantC] };
const KEYS = Object.keys(VARIANTS);
const params = new URLSearchParams(location.search);
let variant = VARIANTS[params.get("variant")] ? params.get("variant") : "A";
let scen = SCENARIOS[params.get("scenario")] ? params.get("scenario") : "day111";
SCENARIOS[scen].make();
const selEl = document.getElementById("scenario");
selEl.innerHTML = Object.entries(SCENARIOS).map(([k, v]) => `<option value="${k}" ${k === scen ? "selected" : ""}>${v.label}</option>`).join("");
const isDark = () => { const r = document.documentElement; return r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches); };

function render() {
  const ae = document.activeElement, focus = ae?.closest("[data-act]") ? null : ae?.id, caret = ae?.selectionStart;
  const scrolls = [...document.querySelectorAll(".b-items,.drawer")].map(e => e.scrollTop);
  document.getElementById("app").innerHTML = `<header><div class="wrap"><nav aria-label="Main">
      <span class="brand"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V9M10 20V4M16 20v-8M22 20H2"/><path d="M16 12V7" stroke="var(--accent)"/></svg>learning<b>.</b>path</span>
      <div class="navlinks"><a class="navlink" href="../today-view/today-view.html">Today</a><a class="navlink" href="../path-screen/path-prototype.html?variant=A">Path</a><a class="navlink on" href="#" aria-current="page">Notes</a>
        <button class="pill sm" data-act="mock" data-msg="would download notes as Markdown, by week (ticket 012)">Export</button>
        <button class="pill sm" data-act="theme" aria-label="Switch between light and dark mode"><span class="dot" aria-hidden="true" style="background:var(--ink)"></span>${isDark() ? "light" : "dark"}</button></div>
    </nav></div></header><main class="wrap">${VARIANTS[variant][1]()}</main>`;
  const fe = focus && document.getElementById(focus);
  if (fe) { fe.focus(); if (caret != null && fe.setSelectionRange) fe.setSelectionRange(caret, caret); }
  [...document.querySelectorAll(".b-items,.drawer")].forEach((e, i) => { if (scrolls[i]) e.scrollTop = scrolls[i]; });
  document.getElementById("vlabel").textContent = `${variant} (${VARIANTS[variant][0]})`;
  const q = new URLSearchParams(location.search); q.set("variant", variant); q.set("scenario", scen); history.replaceState(null, "", "?" + q);
  const ns = allNotes();
  document.getElementById("state").textContent = JSON.stringify({
    variant, scenario: scen, today: S.today, dayNumber: dayNo(), search: S.q || null, scope: S.scope, kind: S.kf,
    notes: { total: ns.length, task: ns.filter(n => n.t.kind === "task").length, day: ns.filter(n => n.t.kind === "day").length, enrollment: ns.filter(n => n.t.kind === "enrollment").length, removed: ns.filter(n => n.t.kind === "removed").length },
    visibleAfterFilter: visible().length,
    editDates: [...new Set(ns.flatMap(n => n.edits))].length + " distinct days (feed the streak)",
    editedToday: ns.filter(n => n.edits.includes(S.today)).map(n => n.key),
    tombstones: S.tomb.map(x => x.id),
  }, null, 2);
}
function cycle(n) { variant = KEYS[(KEYS.indexOf(variant) + n + KEYS.length) % KEYS.length]; S.editing = null; S.drawer = null; render(); }
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"), b = e.target.closest("[data-bar]");
  if (a) {
    const k = a.dataset.k;
    switch (a.dataset.act) {
      case "scope": S.scope = k; break;
      case "kf": S.kf = k; break;
      case "order": S.order = S.order === "asc" ? "desc" : "asc"; break;
      case "sort": S.sort = k; break;
      case "edit": openNote(k); S.editing = k; S.mode = "write"; break;
      case "close": S.editing = null; break;
      case "newday": S.editing = "day:" + S.today; S.mode = "write"; S.kf = "all"; S.q = ""; break;
      case "mode": S.mode = k; break;
      case "sel": openNote(k); S.sel = k; break;
      case "block": S.block = k === "removed" ? "removed" : +k; break;
      case "drawer": openNote(k); S.drawer = k; S.mode = "write"; break;
      case "closedrawer": S.drawer = null; break;
      case "expandc": S.expanded.has(k) ? S.expanded.delete(k) : S.expanded.add(k); break;
      case "jumpweek": render(); document.getElementById("wk-" + k)?.scrollIntoView({ behavior: "smooth" }); return;
      case "mock": toast(a.dataset.msg); return;
      case "theme": document.documentElement.dataset.theme = isDark() ? "light" : "dark"; break;
    }
    render();
    const ta = document.querySelector("textarea.ed"); if (ta && ["edit", "newday", "drawer"].includes(a.dataset.act)) ta.focus();
  }
  if (b) {
    if (b.dataset.bar === "prev") cycle(-1);
    if (b.dataset.bar === "next") cycle(1);
    if (b.dataset.bar === "state") { const p = document.getElementById("state"); p.style.display = p.style.display === "block" ? "none" : "block"; }
  }
});
document.addEventListener("input", e => {
  if (e.target.matches("[data-q]")) { S.q = e.target.value; render(); return; }
  const key = e.target.dataset?.note; if (!key) return;
  setNote(key, e.target.value);
  const live = document.getElementById("live"); if (live) live.innerHTML = md(e.target.value) || `<p class="mono">nothing written yet</p>`; // B: live preview without re-rendering the textarea
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.drawer) { S.drawer = null; render(); return; }
  if (e.target.closest("input,textarea,select,[contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1); if (e.key === "ArrowRight") cycle(1);
});
selEl.addEventListener("change", () => { scen = selEl.value; SCENARIOS[scen].make(); render(); });
render();
</script>
</body>
