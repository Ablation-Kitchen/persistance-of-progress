<!doctype html>
<!--
  PROTOTYPE, throwaway. Ticket 010: what should the Path screen look like?
  Three structurally different variants of the Path screen, switchable via ?variant=A|B|C
  (or ←/→ and the bottom bar), on the real 17-week data embedded by build.sh. State is in memory only.
    A Outline   — one collapsible section per Block, Tasks listed by week, resource index in a side column.
    B Calendar  — the whole run as a weeks × weekdays grid (doubles as the streak calendar), a day pane, index below.
    C Milestones — six Block tiles as stepping stones, then a per-Block table + checkpoint list, index on a tab.
  Rules: 007 (effective day = day + offset, optional never overdue, percent = required only, amended streak),
  006 (tombstones), 009 (URL-less books). Visual direction: 008 (today-view.html).
  Resource index rule under test: key = normalised URL, or for URL-less books the title with any
  "(…)" removed, lowercased. Core resources always on top; the rest in the order the toggle picks.
-->

.cell.active{background:var(--doneSoft)}

#state{position:fixed;right:12px;bottom:74px;width:360px;max-height:60vh;overflow:auto;background:#0E0E0D;color:#E9E6DF;border-radius:14px;padding:14px;font:11.5px/1.6 'JetBrains Mono',monospace;white-space:pre-wrap;display:none;z-index:9;max-width:calc(100vw - 24px)}
</style>
</head>
<body>
<div id="app"></div>

<pre id="state"></pre>

// ---------- dates: plain YYYY-MM-DD, UTC math ----------
const toMs = s => Date.parse(s + "T00:00:00Z");
const addDays = (s, n) => new Date(toMs(s) + n * 864e5).toISOString().slice(0, 10);
const diffDays = (a, b) => Math.round((toMs(a) - toMs(b)) / 864e5);
const fmt = s => new Date(toMs(s)).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" }).toLowerCase();
const fmtShort = s => new Date(toMs(s)).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }).toLowerCase();
const wd = s => new Date(toMs(s)).toLocaleDateString("en-GB", { weekday: "short", timeZone: "UTC" }).toLowerCase();
const dnum = s => new Date(toMs(s)).getUTCDate();

const TASKS = [];
PATH.blocks.forEach((b, bi) => b.tasks.forEach(t => TASKS.push({ ...t, block: bi, order: TASKS.length })));
const BY_ID = Object.fromEntries(TASKS.map(t => [t.id, t]));
const splitTitle = s => { const m = s.match(/^(Weeks? [\d–-]+):\s*(.*)$/); return m ? { weeks: m[1], name: m[2] } : { weeks: "", name: s }; };

// ---------- in-memory Enrollment ----------
const START = "2026-11-16";
let S;
const fresh = today => ({ today, ts: {}, notes: {}, noteEdits: {}, shifts: [], tomb: [], filter: "all", resOrder: "first", resF: "all", resQ: "", openBlocks: null, open: new Set(), selDay: null, selBlock: null, tab: "tasks", kindF: "all" });
const st = id => S.ts[id] || { status: "todo", offset: 0 };
const status = t => st(t.id).status;
const off = t => st(t.id).offset || 0;
const effDay = t => t.day + off(t);
const effDue = t => (t.dueDay ?? t.day) + off(t);
const dateOf = d => addDays(START, d - 1);
const dayNo = () => diffDays(S.today, START) + 1;
const lastDay = () => Math.max(...TASKS.map(effDue));
const rhythm = d => (PATH.weekRhythm || [])[((d - 1) % 7 + 7) % 7] || "";
const weekOf = d => Math.floor((d - 1) / 7) + 1;
const sortT = a => a.sort((x, y) => effDay(x) - effDay(y) || x.order - y.order);
const isOver = (t, D) => !t.optional && status(t) === "todo" && effDue(t) < D;
const isPastOpt = (t, D) => t.optional && status(t) === "todo" && effDue(t) < D;
const blockTasks = bi => TASKS.filter(t => t.block === bi);
const blockRange = bi => { const ts = blockTasks(bi); return { from: Math.min(...ts.map(effDay)), to: Math.max(...ts.map(effDue)) }; };
function currentBlock(D) {
  const end = lastDay(), d = Math.max(1, Math.min(D, end));
  let bi = 0; PATH.blocks.forEach((_, i) => { if (blockRange(i).from <= d) bi = i; }); return bi;
}

function stats() {
  const D = dayNo(), req = TASKS.filter(t => !t.optional);
  const done = req.filter(t => status(t) === "done").length;
  const bonus = TASKS.filter(t => t.optional && status(t) === "done").length;
  const active = new Set([...TASKS.filter(t => status(t) === "done").map(t => st(t.id).statusDate), ...Object.values(S.noteEdits).flat()]);
  const sched = new Set(TASKS.map(t => dateOf(effDay(t))));
  let streak = active.has(S.today) ? 1 : 0, d = addDays(S.today, -1);
  while (diffDays(d, START) >= 0) { if (active.has(d)) streak++; else if (sched.has(d)) break; d = addDays(d, -1); }
  const perBlock = PATH.blocks.map((b, bi) => {
    const ts = blockTasks(bi), r = ts.filter(t => !t.optional), cps = ts.filter(t => t.kind === "checkpoint");
    const n = r.length, dn = r.filter(t => status(t) === "done").length;
    return { n, done: dn, cpN: cps.length, cpDone: cps.filter(t => status(t) === "done").length, over: ts.filter(t => isOver(t, D)).length, complete: dn === n, bonus: ts.filter(t => t.optional && status(t) === "done").length };
  });
  const cps = TASKS.filter(t => t.kind === "checkpoint");
  return { D, pct: Math.round(100 * done / req.length), done, req: req.length, bonus, streak, active, perBlock,
    cpN: cps.length, cpDone: cps.filter(t => status(t) === "done").length, blocksDone: perBlock.filter(p => p.complete).length,
    overdue: TASKS.filter(t => isOver(t, D)).length };
}

// ---------- derived resource index ----------
const normUrl = u => u.trim().replace(/^https?:\/\//, "").replace(/\/+$/, "").toLowerCase();
const normTitle = s => s.replace(/\([^)]*\)/g, "").replace(/[^a-z0-9]+/gi, " ").trim().toLowerCase();
function resIndex() {
  const m = new Map();
  const add = (l, task, coreIdx) => {
    const key = l.url ? "url:" + normUrl(l.url) : "book:" + normTitle(l.title);
    let e = m.get(key);
    if (!e) m.set(key, e = { key, title: l.title, url: l.url, note: null, core: false, coreIdx: null, uses: [], titles: new Set() });
    e.titles.add(l.title);
    if (task) e.uses.push(task); else { e.core = true; e.coreIdx = coreIdx; e.title = l.title; e.note = l.note || null; }
  };
  (PATH.resources || []).forEach((r, i) => add(r, null, i));
  TASKS.forEach(t => (t.links || []).forEach(l => add(l, t)));
  const all = [...m.values()];
  all.forEach(e => { sortT(e.uses); e.first = e.uses.length ? effDay(e.uses[0]) : Infinity; e.block = e.uses.length ? e.uses[0].block : null; });
  return all;
}
function resourceIndex({ cols = false, compact = false } = {}) {
  const all = resIndex(), D = dayNo();
  // filter: chip (all / core / books / still to use) + free-text search over titles, aliases, notes, URLs and the Tasks that use it
  const q = S.resQ.trim().toLowerCase();
  const pass = e => ({ all: true, core: e.core, books: !e.url, todo: e.uses.some(t => status(t) === "todo") })[S.resF]
    && (!q || [...e.titles, e.note || "", e.url || "", ...e.uses.map(t => t.title)].some(s => s.toLowerCase().includes(q)));
  const shown = all.filter(pass);
  const item = e => `<li>
    <div class="res-title">${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)} ↗</a>` : `${esc(e.title)} <span class="tag">book</span>`}
      ${e.core ? `<span class="tag core">core</span>` : ""}</div>
    ${e.note ? `<div class="mono">${esc(e.note)}</div>` : ""}
    ${e.titles.size > 1 ? `<div class="mono">also listed as “${esc([...e.titles].filter(x => x !== e.title).join("”, “"))}”</div>` : ""}
    ${e.uses.length ? `<div class="res-uses">${e.uses.map(t => `<button class="use ${status(t) === "done" ? "done" : ""}" data-act="jump" data-id="${t.id}" title="${esc(t.title)}">d${effDay(t)}${status(t) === "done" ? " ✓" : ""}</button>`).join("")}</div>`
      : `<div class="mono">not linked from a task · whole-path reference</div>`}
  </li>`;
  // the order applies to every entry; core resources are marked by their tag, not pinned
  const list = g => `<ul class="res-list ${cols ? "res-cols" : ""}">${g.map(item).join("")}</ul>`;
  const byFirst = (a, b) => a.first - b.first || (a.coreIdx ?? 99) - (b.coreIdx ?? 99) || a.title.localeCompare(b.title);
  let body;
  if (!shown.length) body = `<p class="mono" style="margin-top:14px">no resources match${q ? ` “${esc(S.resQ)}”` : ""}</p>`;
  else if (S.resOrder === "block") {
    const whole = shown.filter(e => e.block == null);
    body = (whole.length ? `<p class="grp mono">whole path · not linked from a task</p>${list(whole)}` : "")
      + PATH.blocks.map((b, bi) => { const g = shown.filter(e => e.block === bi).sort(byFirst); return g.length ? `<p class="grp mono">${esc(splitTitle(b.title).weeks.toLowerCase())} · ${esc(splitTitle(b.title).name)} · ${g.length}</p>${list(g)}` : ""; }).join("");
  } else body = list(shown.sort(S.resOrder === "az" ? (a, b) => a.title.localeCompare(b.title) : byFirst));
  const sid = "resq-" + variant;
  return `<div class="res-head"><h${compact ? 3 : 2} class="serif">Resources</h${compact ? 3 : 2}><span class="mono">${shown.length === all.length ? `${all.length} entries` : `${shown.length} of ${all.length}`} · from ${(PATH.resources || []).length} core + ${TASKS.reduce((n, t) => n + (t.links || []).length, 0)} task links</span></div>
    <input id="${sid}" class="res-search" type="search" data-resq placeholder="Search resources and the tasks that use them" value="${esc(S.resQ)}" aria-label="Search resources">
    <div class="chips" style="margin:10px 0 4px" role="group" aria-label="Filter resources">
      <span class="mono">show</span>${[["all", "all"], ["core", "core"], ["books", "books"], ["todo", "still to use"]].map(([k, l]) => `<button class="pill sm ${S.resF === k ? "on" : ""}" data-act="resfilter" data-k="${k}" aria-pressed="${S.resF === k}">${l}</button>`).join("")}</div>
    <div class="chips" style="margin:6px 0 4px" role="group" aria-label="Order resources">
      <span class="mono">order</span>${[["first", "first use"], ["block", "by block"], ["az", "a–z"]].map(([k, l]) => `<button class="pill sm ${S.resOrder === k ? "on" : ""}" data-act="resorder" data-k="${k}" aria-pressed="${S.resOrder === k}">${l}</button>`).join("")}</div>
    ${body}`;
}

function setStatus(id, s) { const cur = st(id); S.ts[id] = s === "todo" ? { status: "todo", offset: cur.offset || 0 } : { ...cur, status: s, statusDate: S.today }; }
function shift(n) {
  const ids = TASKS.filter(t => status(t) === "todo").map(t => t.id);
  ids.forEach(id => { const c = st(id); S.ts[id] = { ...c, offset: (c.offset || 0) + n }; });
  S.shifts.push({ appliedOn: S.today, days: n, taskIds: ids });
}
let toastT;
function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg; el.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = "none", 2600); }

// ---------- scenarios ----------
const hash = s => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 100; };
function seedHistory(D) {
  TASKS.forEach(t => {
    if (t.day >= D) return;
    const h = hash(t.id), due = t.dueDay ?? t.day;
    if (t.optional) { if (h < 45) S.ts[t.id] = { status: "done", statusDate: dateOf(due), offset: 0 }; return; }
    if (due >= D) { if (h < 25) S.ts[t.id] = { status: "done", statusDate: dateOf(D - 1), offset: 0 }; return; }
    if (h < 90) S.ts[t.id] = { status: "done", statusDate: dateOf(Math.min(D - 1, due)), offset: 0 };
    else if (h < 94) S.ts[t.id] = { status: "skipped", statusDate: dateOf(t.day), offset: 0 };
  });
  TASKS.filter(t => t.kind === "exercise" && t.dueDay && t.day < D).forEach(t => {
    const dates = []; for (let d = t.day; d <= Math.min(D - 1, t.dueDay); d++) if (/Build/.test(rhythm(d))) dates.push(dateOf(d));
    if (dates.length) S.noteEdits["task:" + t.id] = dates;
  });
}
const at = (D, extra) => () => { S = fresh(dateOf(D)); seedHistory(D); extra && extra(); };
const SCENARIOS = {
  before: { label: "before start", make: () => { S = fresh(addDays(START, -3)); } },
  day24: { label: "week 4 · wed", make: at(24) },
  shifted: { label: "week 4 · after +2 shift, 2 removed", make: () => {
    S = fresh(dateOf(22)); seedHistory(22); shift(2); S.today = dateOf(24);
    // tombstones from a reload (006): removed from the file but they carried progress or a Note
    S.tomb = [
      { id: "tokenizer-deep-dive", title: "Read: Tokenizer internals (removed in v2026-11-20)", kind: "material", day: 4, status: "done", statusDate: dateOf(4), note: "BPE merges, byte fallback; see Karpathy's minbpe." },
      { id: "kv-cache-sketch", title: "Sketch the KV-cache memory maths", kind: "exercise", day: 17, status: "todo", note: "70B, 8k ctx, fp16 → ~40 GB per batch of 16? check." },
    ];
  } },
  day78: { label: "week 12 · mon", make: at(78) },
  after: { label: "after the end", make: () => { S = fresh(dateOf(124)); seedHistory(119); } },
};

// ---------- shared helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  if (!s) return "";
  return esc(s).split(/\n\s*\n/).map(p => "<p>" + p.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')

}
const links = t => (t.links || []).map(l => l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)} ↗</a>` : `<span class="mono">book · ${esc(l.title)}</span>`).join("<br>");
const checkIcon = `<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>`;
const check = t => { const s = status(t); return `<button class="check ${s === "done" ? "on" : s === "skipped" ? "skip" : ""}" data-act="toggle" data-id="${t.id}" aria-label="${s === "done" ? "Mark not done" : "Mark done"}: ${esc(t.title)}" aria-pressed="${s === "done"}">${s === "done" ? checkIcon : ""}</button>`; };
const kindLabel = t => `${t.kind}${t.optional ? " · optional" : ""}`;
// effective day; the authored day is shown only when a shift moved the Task
const whenDay = (t, showOff = true) => `${wd(dateOf(effDay(t)))} ${fmtShort(dateOf(effDay(t)))} · d${effDay(t)}${showOff && off(t) ? ` <span class="status-over">+${off(t)}d</span>` : ""}`;
function statusText(t, D) {

const shiftMark = sh => `<div class="shiftmark mono"><span class="dot" aria-hidden="true"></span>shifted +${sh.days}d on ${fmt(sh.appliedOn)} · ${sh.taskIds.length} open tasks moved</div>`;
const tombList = () => S.tomb.map(x => `<div class="row muted"><span class="check ${x.status === "done" ? "on" : ""}" aria-hidden="true">${x.status === "done" ? checkIcon : ""}</span>
  <div><div class="t">${esc(x.title)}</div><div class="sub"><span class="mono">${x.kind} · was d${x.day} · ${x.status}</span><span class="mono">note: “${esc(x.note.slice(0, 50))}${x.note.length > 50 ? "…" : ""}”</span></div></div>
  <div class="right"><button class="linkbtn" data-act="mock" data-msg="would open this Note on the Notes screen">open note →</button></div></div>`).join("");
const eyebrow = (D, end) => D < 1 ? `starts ${fmt(START)} · in ${1 - D} day${1 - D > 1 ? "s" : ""}` : D > end ? `path finished · ${fmt(S.today)}` : `day ${D} of ${end} · week ${weekOf(D)} of ${weekOf(end)} · ${fmt(S.today)}`;
const heroStats = s => `<dl class="stats">
  <div><dt>required done</dt><dd>${s.pct}%</dd></div>

const ring = (p, size = 44) => { const r = size / 2 - 3, c = 2 * Math.PI * r; return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="bg" cx="${size / 2}" cy="${size / 2}" r="${r}"/><circle class="fg" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-dasharray="${c * p} ${c}"/></svg>`; };
const filterChips = () => `<div class="chips" role="group" aria-label="Filter tasks">${[["all", "all"], ["open", "open"], ["overdue", "overdue"], ["optional", "optional"], ["done", "done"]].map(([k, l]) => `<button class="pill sm ${S.filter === k ? "on" : ""}" data-act="filter" data-k="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join("")}</div>`;
const passFilter = (t, D) => ({ all: true, open: status(t) === "todo", overdue: isOver(t, D), optional: !!t.optional, done: status(t) === "done" })[S.filter];

// ================= Variant A: Outline =================

      ${table}</section>${cpPanel}</div>`;
  const cbName = D < 1 ? "Ready" : D > end ? "Done" : `Block <em>${cb + 1}</em> of ${PATH.blocks.length}`;
  return `<section class="hero rise"><div><p class="eyebrow mono"><span class="dot pulse" aria-hidden="true"></span>${eyebrow(D, end)}</p>
      <h1 class="serif">${cbName}.</h1><p class="goal">${D < 1 ? esc(PATH.title) : D > end ? `${s.done} of ${s.req} required tasks · +${s.bonus} bonus` : esc(PATH.blocks[cb].goal)}</p></div>${heroStats(s)}</section>
    <div class="tiles" role="group" aria-label="Blocks">${tiles}</div>${tabs}${content}<div style="height:40px"></div>`;
}

// ---------- page shell + wiring ----------
const VARIANTS = { A: ["Outline", VariantA], B: ["Calendar", VariantB], C: ["Milestones", VariantC] };
const KEYS = Object.keys(VARIANTS);
const params = new URLSearchParams(location.search);
let variant = VARIANTS[params.get("variant")] ? params.get("variant") : "A";
let scen = SCENARIOS[params.get("scenario")] ? params.get("scenario") : "shifted";
SCENARIOS[scen].make();
const selEl = document.getElementById("scenario");
selEl.innerHTML = Object.entries(SCENARIOS).map(([k, v]) => `<option value="${k}" ${k === scen ? "selected" : ""}>${v.label}</option>`).join("");
const isDark = () => { const r = document.documentElement; return r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches); };

function render() {
  const ae = document.activeElement, focus = ae?.closest("[data-act]") ? null : ae?.id, caret = ae?.selectionStart;
  const asideScroll = document.querySelector(".a-layout aside")?.scrollTop;
  document.getElementById("app").innerHTML = `<header><div class="wrap"><nav aria-label="Main">
      <span class="brand"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V9M10 20V4M16 20v-8M22 20H2"/><path d="M16 12V7" stroke="var(--accent)"/></svg>learning<b>.</b>path</span>
      <div class="navlinks"><a class="navlink" href="../today-view/today-view.html">Today</a><a class="navlink on" href="#" aria-current="page">Path</a><a class="navlink" href="#">Notes</a>
        <button class="pill sm" data-act="theme" aria-label="Switch between light and dark mode"><span class="dot" aria-hidden="true" style="background:var(--ink)"></span>${isDark() ? "light" : "dark"}</button></div>
    </nav></div></header><main class="wrap">${VARIANTS[variant][1]()}</main>`;
  const fe = focus && document.getElementById(focus);
  if (fe) { fe.focus(); if (caret != null && fe.setSelectionRange) fe.setSelectionRange(caret, caret); }
  const asideEl = document.querySelector(".a-layout aside"); if (asideEl && asideScroll) asideEl.scrollTop = asideScroll;
  document.getElementById("vlabel").textContent = `${variant} (${VARIANTS[variant][0]})`;
  const q = new URLSearchParams(location.search); q.set("variant", variant); q.set("scenario", scen); history.replaceState(null, "", "?" + q);
  const s = stats(), idx = resIndex();
  document.getElementById("state").textContent = JSON.stringify({
    variant, scenario: scen, today: S.today, dayNumber: s.D, lastEffectiveDay: lastDay(), currentBlock: currentBlock(s.D) + 1,
    derived: { percent: s.pct, requiredDone: `${s.done}/${s.req}`, bonus: s.bonus, checkpoints: `${s.cpDone}/${s.cpN}`, blocksComplete: s.blocksDone, streak: s.streak, overdue: s.overdue },
    perBlock: s.perBlock.map((p, i) => `${i + 1}: ${p.done}/${p.n} req · cp ${p.cpDone}/${p.cpN} · over ${p.over} · d${blockRange(i).from}–${blockRange(i).to}`),
    shifts: S.shifts.map(x => ({ appliedOn: x.appliedOn, days: x.days, tasksMoved: x.taskIds.length })),
    tombstones: S.tomb.map(x => x.id),
    resourceIndex: { entries: idx.length, core: idx.filter(e => e.core).length, coreAlsoInTasks: idx.filter(e => e.core && e.uses.length).length,
      booksWithoutUrl: idx.filter(e => !e.url).length, mergedUnderDifferentTitles: idx.filter(e => e.titles.size > 1).map(e => [...e.titles]) },
  }, null, 2);
}
function cycle(n) { variant = KEYS[(KEYS.indexOf(variant) + n + KEYS.length) % KEYS.length]; render(); }
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"), b = e.target.closest("[data-bar]");
  if (a) {
    const id = a.dataset.id, k = a.dataset.k;
    switch (a.dataset.act) {
      case "toggle": setStatus(id, status(BY_ID[id]) === "done" ? "todo" : "done"); break;
      case "expand": S.open.has(id) ? S.open.delete(id) : S.open.add(id); break;
      case "toggleblock": { const bi = +a.dataset.bi; S.openBlocks.has(bi) ? S.openBlocks.delete(bi) : S.openBlocks.add(bi); break; }
      case "allblocks": S.openBlocks = new Set(k === "open" ? PATH.blocks.map((_, i) => i) : []); break;
      case "filter": S.filter = k; break;
      case "resorder": S.resOrder = k; break;
      case "resfilter": S.resF = k; break;
      case "selday": S.selDay = +a.dataset.day; break;
      case "selblock": S.selBlock = +a.dataset.bi; S.tab = "tasks"; break;
      case "tab": S.tab = k; break;
      case "kind": S.kindF = k; break;
      case "jump": { // a resource-use chip: show that Task in the current variant
        const t = BY_ID[id];
        if (variant === "A") { S.openBlocks.add(t.block); S.open.add(id); S.filter = "all"; }
        if (variant === "B") S.selDay = effDay(t);
        if (variant === "C") { S.selBlock = t.block; S.tab = "tasks"; S.kindF = "all"; S.open.add(id); }
        toast(`day ${effDay(t)} · ${t.title}`); break;
      }
      case "mock": toast(a.dataset.msg); break;
      case "theme": document.documentElement.dataset.theme = isDark() ? "light" : "dark"; break;
    }
    render();
  }
  if (b) {
    if (b.dataset.bar === "prev") cycle(-1);
    if (b.dataset.bar === "next") cycle(1);
    if (b.dataset.bar === "state") { const p = document.getElementById("state"); p.style.display = p.style.display === "block" ? "none" : "block"; }
  }
});
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,select,[contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1); if (e.key === "ArrowRight") cycle(1);
});
document.addEventListener("input", e => { if (e.target.matches("[data-resq]")) { S.resQ = e.target.value; render(); } });
selEl.addEventListener("change", () => { scen = selEl.value; SCENARIOS[scen].make(); render(); });
render();
</script>
</body>
