# End-to-end stack (ticket 16). Standalone on purpose: a separate project name, its own volume,
# a temporary copy of paths/ and a different host port, so it can never touch a real instance.
name: lt-e2e
services:
  app:
    build: ..
    init: true
    ports: ["127.0.0.1:${E2E_PORT:?set by e2e/docker.ts}:3000"]
    volumes: ["./.tmp/paths:/paths:ro", "appdata:/data"]
    environment: { PUBLIC_PORT: "${E2E_PORT:?set by e2e/docker.ts}" }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
volumes: { appdata: {} }
